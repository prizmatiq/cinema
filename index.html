<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cinema</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Ccircle cx='20' cy='20' r='17' fill='%23EDEAE7' stroke='%231F1B18' stroke-width='2.4'/%3E%3Cg fill='%231F1B18'%3E%3Ccircle cx='20' cy='20' r='3'/%3E%3Ccircle cx='20' cy='10.5' r='4'/%3E%3Ccircle cx='29' cy='17' r='4'/%3E%3Ccircle cx='25.6' cy='27.7' r='4'/%3E%3Ccircle cx='14.4' cy='27.7' r='4'/%3E%3Ccircle cx='11' cy='17' r='4'/%3E%3C/g%3E%3C/svg%3E">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style id="css">
/* Layout: a film shelf — years down the left in mono, titles and ratings to the right; greys throughout, dark brown for small marks, orange only for primary actions */
:root{
  --bg:#ECECEB; --surface:#F7F7F6; --fg:#1F1B18; --muted:#6E6A67; --line:#D3D1CF;
  --brown:#5A3A2A; --brown-soft:#E2D9D3; --orange:#C9581A; --on-orange:#FFFFFF; --tile:#2B2927; --on-tile:#EDEAE7; --star-off:#CFCCC9;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131212; --surface:#1B1A19; --fg:#EAE7E4; --muted:#9A9591; --line:#2D2A28;
  --brown:#C8A891; --brown-soft:#2F211A; --orange:#E57E3A; --on-orange:#1A1110; --tile:#2A2826; --on-tile:#E6E2DE; --star-off:#3A3734; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131212; --surface:#1B1A19; --fg:#EAE7E4; --muted:#9A9591; --line:#2D2A28;
  --brown:#C8A891; --brown-soft:#2F211A; --orange:#E57E3A; --on-orange:#1A1110; --tile:#2A2826; --on-tile:#E6E2DE; --star-off:#3A3734; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body.lock{overflow:hidden}
.wrap{max-width:1000px;margin:0 auto;padding-block:32px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;letter-spacing:-.01em;margin:0;color:var(--fg);text-wrap:balance}
.masthead{display:flex;align-items:center;gap:16px 32px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;color:var(--fg);flex:none}
.logo svg{width:40px;height:40px;display:block}
.nav{display:flex;gap:4px 28px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.nav::-webkit-scrollbar{display:none}
.nt{background:none;border:0;padding:6px 0 8px;text-align:left;cursor:pointer;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.nt b{display:block;font-size:22px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;line-height:1.2}
.nt:hover b,.nt:hover{color:var(--fg)}
.nt[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.nt[aria-selected=true] b{color:var(--fg)}
@media (max-width:640px){.nav{margin-left:0;width:100%;gap:4px 22px}}
.decades{display:flex;align-items:flex-end;gap:4px;height:60px;margin:22px 0 0}
.decades button{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:10px}
.decades .bar{width:100%;background:var(--muted);opacity:.55;border-radius:2px 2px 0 0}
.decades button:hover .bar{background:var(--fg);opacity:1}
.tools{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px;margin-top:16px;border-bottom:1px solid var(--line);display:flex;gap:8px;flex-wrap:wrap}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
input,select,button,textarea{font:inherit;color:var(--fg)}
input[type=search],input[type=text],input[type=number],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
input[type=search]{flex:1 1 200px;min-width:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--orange);background:var(--orange);color:var(--on-orange);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn:disabled{opacity:.5;cursor:default}
.banner{margin-top:22px;padding:16px 18px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner h2{font-family:var(--f-display);font-stretch:78%;font-size:26px;margin:0;line-height:1.1}
.banner p{margin:4px 0 0;color:var(--muted);max-width:60ch}
.banner button{background:none;border:1px solid currentColor;color:inherit;border-radius:6px;padding:6px 10px;cursor:pointer;font-size:13px}
section.dec{margin-top:34px}
section.dec h2{font-family:var(--f-display);font-stretch:75%;font-weight:700;font-size:28px;margin:0 0 6px;display:flex;align-items:baseline;gap:12px;color:var(--fg)}
section.dec h2 small{font-family:var(--f-mono);font-size:12px;font-weight:400;color:var(--muted)}
.yr{display:grid;grid-template-columns:60px 1fr;gap:0 16px;border-top:1px solid var(--line);padding-block:6px}
.yr .y{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:8px}
.films{display:flex;flex-direction:column;min-width:0}
.film{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 8px;margin:0 -8px;cursor:pointer;color:inherit}
.film:hover{background:var(--surface)}
.film .t{font-weight:600}
.film .meta{color:var(--muted);font-size:13px}
.film .meta .gen{font-style:italic}
.film .seen{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--brown);border:1px solid var(--brown);border-radius:3px;padding:2px 5px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.rt{display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.stars{position:relative;display:inline-block;font-size:15px;line-height:1;letter-spacing:0;white-space:nowrap}
.stars .s{display:inline-block;width:1.05em;text-align:center}
.stars .base{color:var(--star-off)}
.stars .fill{position:absolute;inset:0 auto 0 0;overflow:hidden;color:var(--fg);white-space:nowrap}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;margin-top:10px}
.tile{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;min-width:0}
.tile .art{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:5px;background:var(--tile);color:var(--on-tile);padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s}
.tile:hover .art{transform:translateY(-2px)}
.tile .art .at{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:17px;line-height:1.02;overflow-wrap:anywhere;text-wrap:balance}
.tile .art .ay{font-family:var(--f-mono);font-size:11px;opacity:.65}
.tile .art .ad{font-size:11px;opacity:.65;line-height:1.2}
.tile .art .w{position:absolute;top:8px;right:8px;font:500 9px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:var(--on-tile);color:var(--tile);border-radius:3px;padding:3px 5px}
.tile .cap{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile .cap .stars{font-size:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion: reduce){.tile .art{transition:none}}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:22px}
.col{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:inherit;min-width:0}
.col:hover{border-color:var(--muted)}
.col h3{font-family:var(--f-display);font-stretch:78%;font-size:22px;line-height:1.1;margin:0;color:var(--fg)}
.col p{margin:0;color:var(--muted);font-size:13.5px}
.col .cnt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.col .peek{font-size:13px;color:var(--fg);opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.col.new{border-style:dashed;cursor:default}
.col.new input,.col.new textarea{width:100%}
.scrim{position:fixed;inset:0;background:rgba(10,8,7,.45);z-index:30}
.drawer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100% - 32px));max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));z-index:31;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow-y:auto;padding:20px 24px 26px;display:flex;flex-direction:column;gap:18px;animation:pop .16s ease-out}
.drawer.narrow{width:min(520px,calc(100% - 32px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
.drawer .top{display:flex;justify-content:flex-end;align-items:flex-start;position:sticky;top:0;z-index:3;height:0;overflow:visible}
.drawer .top .x{background:var(--bg)}
.mgrid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:26px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.mcol .info{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:72px}
.mcol .info h2{font-family:var(--f-display);font-stretch:80%;font-size:32px;line-height:1.02;margin:0;color:var(--fg);text-wrap:balance}
.mcol .info .d{color:var(--muted)}
.x{background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;color:var(--muted)}
.poster{aspect-ratio:2/3;max-width:180px;width:46%;background:var(--tile);color:var(--on-tile);border-radius:6px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-self:flex-start}
.poster .pt{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.poster .py{font-family:var(--f-mono);font-size:12px;opacity:.7}
.head{display:flex;gap:16px;align-items:flex-start}
.head .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.head .info h2{font-family:var(--f-display);font-stretch:80%;font-size:26px;line-height:1.05;margin:0;color:var(--fg)}
.head .info .d{color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>.lbl{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fld input,.fld textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.starin{position:relative;display:inline-flex;font-size:30px;line-height:1;cursor:pointer;user-select:none;align-self:flex-start}
.starin .hit{position:absolute;top:0;bottom:0;width:.525em;background:none;border:0;padding:0;cursor:pointer}
.starin .hit:focus-visible{outline:2px solid var(--orange)}
.rv{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:10px;align-self:center}
.fld>.rv{align-self:flex-start;margin-left:0}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:500 12px/1 var(--f-body);padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.mchip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.mchip[disabled]{cursor:default}
.watch{align-self:flex-start}
.ext{display:flex;gap:14px;font-size:13px}
.ext a{color:var(--fg);text-underline-offset:3px;text-decoration-color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tile);color:var(--on-tile);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{margin-top:56px;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:640px){
  .yr{grid-template-columns:44px 1fr;gap:0 10px}.yr .y{font-size:15px}
  .film{grid-template-columns:minmax(0,1fr)}
  .rt{gap:10px}
  .drawer{left:0;right:0;top:auto;bottom:0;transform:none;width:100%;max-height:92dvh;border-radius:14px 14px 0 0;border-width:1px 0 0;
    padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:rise .2s ease-out}
  .drawer.narrow{width:100%}
  .mgrid{grid-template-columns:1fr;gap:18px}
  .mgrid .poster{max-width:190px;position:relative}
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}.drawer{animation:none}}
.tile .art img,.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tile .art.has-img .ay,.tile .art.has-img .at,.tile .art.has-img .ad{visibility:hidden}
.poster{position:relative;overflow:hidden}
.poster.has-img>span{visibility:hidden}
.mgrid .poster{width:100%;max-width:none;position:sticky;top:0}
.decades button.on .bar{background:var(--fg);opacity:1}
.decades button.on{color:var(--fg)}
.decades.filtering button:not(.on) .bar{opacity:.25}
.flat .yr{grid-template-columns:60px 1fr}
@media (max-width:640px){.mgrid .poster{max-width:170px;position:relative}.mcol .info{padding-right:0}.mgrid{padding-top:36px}}
.tile .art .w{z-index:2}
.ov{font-size:14px;color:var(--muted);line-height:1.5}
</style>
</head>
<body>
<div id="app"></div>
<script id="main">
(function(){
const TITLE="Cinema";
/* If the site is not at <owner>.github.io/<repo>, set owner and repo here */
const CONFIG={owner:"",repo:"",branch:"main",path:"data/library.json"};
const IMG="https://image.tmdb.org/t/p/";
let films=[], cols=[];
const posterSrc=(f,w)=>f.poster.startsWith("http")?(w>400?f.poster.replace(/\._V1_.*\.jpg$/,"._V1_SX700.jpg"):f.poster):IMG+"w"+w+f.poster;
const ui={view:"films",layout:"grid",q:"",genre:null,col:null,show:"all",order:"new",decade:null,open:null,editable:false,dirty:false,saving:false,msg:"",adding:false};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colName=id=>(cols.find(c=>c.id===id)||{}).name||"";
const $=s=>app.querySelector(s);
const uid=()=>"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function starsHTML(v,size){
  const five='<span class="s">★</span>'.repeat(5);
  return `<span class="stars" ${size?`style="font-size:${size}px"`:""} aria-label="${v} out of 5"><span class="base">${five}</span><span class="fill" style="width:${(v||0)*1.05}em">${five}</span></span>`;
}
function ratingsRow(f){
  let h="";
  if(f.r!=null)h+=starsHTML(f.r,14);
  if(f.lb!=null)h+=`<span><span class="k">LB</span>${Number(f.lb).toFixed(1)}</span>`;
  if(f.imdb!=null)h+=`<span><span class="k">IMDb</span>${Number(f.imdb).toFixed(1)}</span>`;
  return h?`<span class="rt">${h}</span>`:`<span class="rt"></span>`;
}

function shell(){
  app.innerHTML=`<div class="wrap">
    <header class="masthead">
      <span class="logo" aria-label="Cinema" title="Cinema"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><circle cx="20" cy="20" r="17" stroke="currentColor" stroke-width="2.4"/><circle cx="20" cy="20" r="3" fill="currentColor"/><circle cx="20" cy="10.5" r="4" fill="currentColor"/><circle cx="29" cy="17" r="4" fill="currentColor"/><circle cx="25.6" cy="27.7" r="4" fill="currentColor"/><circle cx="14.4" cy="27.7" r="4" fill="currentColor"/><circle cx="11" cy="17" r="4" fill="currentColor"/></svg></span>
      <nav class="nav" id="nav" role="tablist" aria-label="Sections"></nav>
    </header>
    <div id="view"></div>
    <div class="foot" id="foot"></div>
    <p style="margin-top:20px;font-size:12px;color:var(--muted)">Posters and film data from <a href="https://www.omdbapi.com" target="_blank" rel="noopener" style="color:inherit">OMDb</a> and <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:inherit">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </div>
  <div id="drawerRoot"></div>
  <div class="savebar" id="savebar" hidden><div class="in"><span id="savemsg"></span><button class="btn" id="savebtn">Save to GitHub</button></div></div>`;
  $("#nav").onclick=e=>{const b=e.target.closest(".nt");if(!b)return;ui.view=b.dataset.v;ui.col=null;ui.q="";ui.genre=null;ui.show="all";ui.decade=null;render();window.scrollTo(0,0)};
  $("#savebtn").onclick=save;
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.open||ui.adding||ui.access)){ui.access=false;closeDrawer()}});
}
const TYPE=f=>f.type||"film";
const VIEWS=[["films","Films",f=>TYPE(f)==="film"],["series","Series",f=>TYPE(f)==="series"],["shorts","Shorts",f=>TYPE(f)==="short"],["watched","Watched",f=>f.w]];
const NOUN={films:"film",series:"series",shorts:"short",watched:"film",collections:"film"};
const VTYPE={series:"series",shorts:"short"};
function viewPred(){const v=VIEWS.find(x=>x[0]===ui.view);return v?v[2]:()=>true}
function stats(){
  $("#nav").innerHTML=VIEWS.map(([id,label,pr])=>`<button class="nt" role="tab" data-v="${id}" aria-selected="${ui.view===id}"><b>${films.filter(pr).length}</b>${label}</button>`).join("")+
    `<button class="nt" role="tab" data-v="collections" aria-selected="${ui.view==="collections"}"><b>${cols.length}</b>Collections</button>`;
}
function render(){
  stats();
  if(ui.view==="collections"&&!ui.col)collectionsView();else libraryView();
  foot();bar();
}
function libraryView(){
  const c=ui.col?cols.find(x=>x.id===ui.col):null;
  $("#view").innerHTML=(c?`<div class="banner"><div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p></div><button id="clearcol">${ui.view==="collections"?"All collections":"Clear filter"}</button></div>`:`<div class="decades" id="decades" aria-label="Films by decade"></div>`)+
  `<div class="tools">
    <input type="search" id="q" placeholder="Search title, director, genre" aria-label="Search" value="${esc(ui.q)}">
    <select id="gensel" aria-label="Genre"><option value="">All genres</option>${[...new Set(films.flatMap(f=>f.g||[]))].sort().map(g=>`<option ${ui.genre===g?"selected":""}>${esc(g)}</option>`).join("")}</select>

function decades(){
  const P=viewPred(),src=films.filter(P);
  if(!src.length){const el=$("#decades");if(el)el.innerHTML="";return}
  const m={};src.forEach(f=>{const d=Math.floor(f.y/10)*10;m[d]=(m[d]||0)+1});
  const ys=src.map(f=>f.y),lo=Math.floor(Math.min(...ys)/10)*10,hi=Math.floor(Math.max(...ys)/10)*10,max=Math.max(...Object.values(m));
  let h="";for(let d=lo;d<=hi;d+=10)h+=`<button data-d="${d}" title="${d}s: ${m[d]||0} — click to filter"><span class="bar" style="height:${(m[d]||0)/max*42+1}px"></span>${String(d).slice(2)}</button>`;
  const el=$("#decades");el.innerHTML=h;

  el.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",Number(b.dataset.d)===ui.decade);b.setAttribute("aria-pressed",Number(b.dataset.d)===ui.decade)});

function dirty(){ui.dirty=true;ui.msg="";bar()}

/* ---------- GitHub storage ---------- */
function repoInfo(){
  const h=location.hostname,parts=location.pathname.split("/").filter(Boolean);
  const owner=CONFIG.owner||(h.endsWith(".github.io")?h.split(".")[0]:"");
  const repo=CONFIG.repo||(h.endsWith(".github.io")?(parts[0]||h):"");
  return {owner,repo};
}
const TOKEN_KEY="film-library-token";
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""}}
function setToken(t){try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
async function gh(path,opts={}){
  const {owner,repo}=repoInfo();
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`,{...opts,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+getToken(),...(opts.headers||{})}});
  if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}
  return r.json();
}
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
async function readRemote(){
  const j=await gh(`/contents/${CONFIG.path}?ref=${CONFIG.branch}&t=${Date.now()}`);
  return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
}
/* Local edits win for personal fields; enrichment fields (poster, ids, IMDb) come from the repo when the local copy lacks them. */
const AUTO=["tmdbId","poster","imdbId","imdbAuto","overview","runtime"];
function merge(remote){
  const R=new Map(remote.films.map(f=>[f.id,f]));
  const out=films.map(f=>{const r=R.get(f.id);if(!r)return f;const m={...r,...f};AUTO.forEach(k=>{if(f[k]==null&&r[k]!=null)m[k]=r[k]});return m});
  remote.films.forEach(r=>{if(!films.some(f=>f.id===r.id)&&!deleted.has(r.id))out.push(r)});
  const C=new Map(remote.cols.map(c=>[c.id,c]));cols.forEach(c=>C.set(c.id,c));
  return {films:out,cols:[...C.values()]};
}
const deleted=new Set();
async function save(){
  if(ui.saving)return;ui.saving=true;ui.msg="";bar();
  try{
    for(let attempt=0;attempt<2;attempt++){
      const {sha,data}=await readRemote();
      const merged=merge(data);
      try{
        await gh(`/contents/${CONFIG.path}`,{method:"PUT",body:JSON.stringify({message:"Update library from web app",content:b64enc(JSON.stringify(merged,null,1)+"\n"),sha,branch:CONFIG.branch})});
        films=merged.films;cols=merged.cols;ui.dirty=false;ui.msg="Saved";break;
      }catch(e){if(e.status===409&&attempt===0)continue;throw e}
    }
  }catch(e){
    ui.msg=e.status===401||e.status===403?"GitHub refused the token. Check it in Editor access":e.status===404?"Repository or file not found. Check Editor access settings":"Couldn't save. Check your connection and try again";
  }
  ui.saving=false;render();
}
function exportData(){
  const blob=new Blob([JSON.stringify({films,cols},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="film-library.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function accessDrawer(){
  const root=document.getElementById("drawerRoot");document.body.classList.add("lock");ui.access=true;
  const {owner,repo}=repoInfo();const has=!!getToken();
  root.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer narrow" role="dialog" aria-modal="true" aria-label="Editor access"><div class="top"><button class="x" id="close">Close</button></div>
    <div class="head"><div class="info"><h2>Editor access</h2><span class="d">Paste a GitHub token that can write to <b>${esc(owner)}/${esc(repo)}</b>. It stays in this browser only. Visitors without a token see the library read-only.</span></div></div>
    <label class="fld"><span class="lbl">GitHub token</span><input type="password" id="tok" autocomplete="off" placeholder="github_pat_…" value="${has?"••••••••":""}"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="tsave">Save token</button>${has?`<button class="btn ghost" id="tclear">Sign out</button>`:""}</div>
    <span class="rv" id="tmsg" style="margin:0"></span></aside>`;
  const R=s=>root.querySelector(s),close=()=>{ui.access=false;closeDrawer()};
  R("#close").onclick=close;R("#scrim").onclick=close;
  R("#tsave").onclick=async()=>{const v=R("#tok").value.trim();if(!v||v.startsWith("•"))return;setToken(v);R("#tmsg").textContent="Checking…";
    try{const j=await gh("");if(!j.permissions||!j.permissions.push)throw Object.assign(new Error(),{status:403});ui.editable=true;R("#tmsg").textContent="Connected. You can edit now.";render()}
    catch(e){setToken("");ui.editable=false;R("#tmsg").textContent=e.status===404?"Repository not found for this token.":"This token can't write to the repository.";render()}};
  if(R("#tclear"))R("#tclear").onclick=()=>{setToken("");ui.editable=false;close();render()};
}
async function load(){
  try{
    if(getToken()){try{const {data}=await readRemote();films=data.films;cols=data.cols;ui.editable=true}catch(e){ui.editable=false}}
    if(!films.length){
      const {owner,repo}=repoInfo();let d=null;
      if(owner&&repo){try{const r=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${CONFIG.branch}/${CONFIG.path}?v=${Date.now()}`);if(r.ok)d=await r.json()}catch(e){}}
      if(!d){const r=await fetch(CONFIG.path+"?v="+Date.now());d=await r.json()}
      films=d.films;cols=d.cols}
  }catch(e){ui.msg="Couldn't load the library";}
  render();
}
window.addEventListener("beforeunload",e=>{if(ui.dirty){e.preventDefault();e.returnValue=""}});
shell();render();load();
})();
</script>
</body>
