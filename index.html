<style id="css">
/* Layout: a film shelf — years down the left in mono, titles and ratings to the right; greys throughout, dark brown for small marks, orange only for primary actions */
:root{
  --bg:#ECECEB; --surface:#F7F7F6; --fg:#1F1B18; --muted:#6E6A67; --line:#D3D1CF;
  --brown:#5A3A2A; --brown-soft:#E2D9D3; --orange:#C9581A; --on-orange:#FFFFFF; --tile:#2B2927; --on-tile:#EDEAE7; --star-off:#CFCCC9;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#131212; --surface:#1B1A19; --fg:#EAE7E4; --muted:#9A9591; --line:#2D2A28;
  --brown:#C8A891; --brown-soft:#2F211A; --orange:#E57E3A; --on-orange:#1A1110; --tile:#2A2826; --on-tile:#E6E2DE; --star-off:#3A3734; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#131212; --surface:#1B1A19; --fg:#EAE7E4; --muted:#9A9591; --line:#2D2A28;
  --brown:#C8A891; --brown-soft:#2F211A; --orange:#E57E3A; --on-orange:#1A1110; --tile:#2A2826; --on-tile:#E6E2DE; --star-off:#3A3734; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
img{max-width:100%}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
body.lock{overflow:hidden}
.wrap{max-width:1000px;margin:0 auto;padding-block:32px 110px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-family:var(--f-display);font-stretch:78%;font-weight:800;font-size:clamp(34px,7vw,56px);line-height:1;letter-spacing:-.01em;margin:0;color:var(--fg);text-wrap:balance}
.masthead{display:flex;align-items:center;gap:16px 36px;flex-wrap:wrap;padding-bottom:18px;border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;color:var(--fg);flex:none;border-radius:50%}
.logo .emo{font-size:36px;line-height:1;display:block;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;text-decoration:none}
.logo{text-decoration:none}
.logo:hover{opacity:.8}
.acts{display:flex;gap:8px;flex:none;margin-left:auto}
.ib{position:relative;width:40px;height:40px;display:grid;place-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--muted);cursor:pointer;padding:0}
.ib:hover,.ib[aria-expanded=true]{color:var(--fg);border-color:var(--muted)}
.ib .dot{position:absolute;top:7px;right:7px;width:7px;height:7px;border-radius:50%;background:var(--orange)}
.logo svg{width:40px;height:40px;display:block}
.nav{display:flex;gap:4px 28px;overflow-x:auto;max-width:100%;scrollbar-width:none}

.nt{background:none;border:0;padding:6px 0 8px;text-align:left;cursor:pointer;color:var(--muted);font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;border-bottom:2px solid transparent;white-space:nowrap;flex:none}
.nt b{display:block;font-size:22px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;letter-spacing:0;text-transform:none;line-height:1.2}
.nt:hover b,.nt:hover{color:var(--fg)}
.nt[aria-selected=true]{color:var(--fg);border-bottom-color:var(--fg)}
.nt[aria-selected=true] b{color:var(--fg)}
@media (max-width:640px){.nav{margin-left:0;width:100%;gap:4px 22px;order:3}.acts{margin-left:auto}}
.decades{display:flex;align-items:flex-end;gap:4px;height:60px;margin:22px 0 0}
.decades button{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;height:100%;background:none;border:0;padding:0;cursor:pointer;color:var(--muted);font-family:var(--f-mono);font-size:10px}

input,select,button,textarea{font:inherit;color:var(--fg)}
input[type=search],input[type=text],input[type=number],select,textarea{padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
input[type=search]{flex:1 1 200px;min-width:0}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.btn{padding:8px 14px;border-radius:6px;border:1px solid var(--orange);background:var(--orange);color:var(--on-orange);font-weight:600;cursor:pointer;white-space:nowrap}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}

.banner{margin-top:22px;padding:16px 18px;border-radius:8px;background:var(--surface);border:1px solid var(--line);color:var(--fg);display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.banner h2{font-family:var(--f-display);font-stretch:78%;font-size:26px;margin:0;line-height:1.1}

section.dec{margin-top:34px}

.yr{display:grid;grid-template-columns:60px 1fr;gap:0 16px;border-top:1px solid var(--line);padding-block:6px}
.yr .y{font-family:var(--f-mono);font-size:18px;font-weight:500;color:var(--muted);font-variant-numeric:tabular-nums;padding-top:8px}
.films{display:flex;flex-direction:column;min-width:0}
.film{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;width:100%;text-align:left;background:none;border:0;border-radius:6px;padding:8px 8px;margin:0 -8px;cursor:pointer;color:inherit}
.film:hover{background:var(--surface)}
.film .t{font-weight:600}
.film .meta{color:var(--muted);font-size:13px}
.film .meta .gen{font-style:italic}
.film .seen{font:500 10px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--brown);border:1px solid var(--brown);border-radius:3px;padding:2px 5px;margin-left:8px;vertical-align:2px;white-space:nowrap}
.rt{display:flex;gap:14px;align-items:center;font-family:var(--f-mono);font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.rt .k{font-size:9.5px;letter-spacing:.06em;text-transform:uppercase;margin-right:4px}
.stars{position:relative;display:inline-block;font-size:15px;line-height:1;letter-spacing:0;white-space:nowrap}
.stars .s{display:inline-block;width:1.05em;text-align:center}
.stars .base{color:var(--star-off)}
.stars .fill{position:absolute;inset:0 auto 0 0;overflow:hidden;color:var(--fg);white-space:nowrap}
.empty{color:var(--muted);padding:40px 0;text-align:center}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:18px 14px;margin-top:10px}
.tile{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;text-align:left;cursor:pointer;color:inherit;min-width:0}
.tile .art{aspect-ratio:2/3;width:100%;max-width:100%;border-radius:5px;background:var(--tile);color:var(--on-tile);padding:10px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;transition:transform .15s}
.tile:hover .art{transform:translateY(-2px)}
.tile .art .at{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:17px;line-height:1.02;overflow-wrap:anywhere;text-wrap:balance}
.tile .art .ay{font-family:var(--f-mono);font-size:11px;opacity:.65}
.tile .art .ad{font-size:11px;opacity:.65;line-height:1.2}
.tile .art .w{position:absolute;top:8px;right:8px;font:500 9px/1 var(--f-mono);text-transform:uppercase;letter-spacing:.06em;background:var(--on-tile);color:var(--tile);border-radius:3px;padding:3px 5px}
.tile .cap{display:flex;flex-direction:column;gap:2px}
.tile .cap .ct{font-size:13.5px;font-weight:600;color:var(--fg);line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tile .cap .cy{font:12px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.tile .cap .stars{font-size:11px;vertical-align:-1px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--surface);border:0;padding:8px 12px;cursor:pointer;color:var(--muted);font-size:13px}
.seg button[aria-pressed=true]{background:var(--fg);color:var(--bg)}
@media (prefers-reduced-motion: reduce){.tile .art{transition:none}}
.cols{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px;margin-top:22px}
.col{display:flex;flex-direction:column;gap:8px;text-align:left;padding:16px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:inherit;min-width:0}
.col:hover{border-color:var(--muted)}
.col h3{font-family:var(--f-display);font-stretch:78%;font-size:22px;line-height:1.1;margin:0;color:var(--fg)}
.col p{margin:0;color:var(--muted);font-size:13.5px}
.col .cnt{font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.col .peek{font-size:13px;color:var(--fg);opacity:.8;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical}
.col.new{border-style:dashed;cursor:default}
.frs{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-top:22px}
.fr{display:flex;flex-direction:column;gap:10px;text-align:left;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);cursor:pointer;color:inherit;min-width:0}
.fr:hover{border-color:var(--muted)}
.frstrip{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.frp{aspect-ratio:2/3;border-radius:3px;background:var(--tile);position:relative;overflow:hidden}
.frp img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.frt{display:flex;flex-direction:column;gap:2px}
.frt b{font-family:var(--f-display);font-stretch:80%;font-size:20px;line-height:1.1}
.frt span{font:12px var(--f-mono);color:var(--muted)}
.frlink{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:inherit;cursor:pointer}
.frlink:hover{border-color:var(--muted)}
.frl-strip{display:flex;gap:3px;flex:none}
.frl-strip .frp{width:26px}
.frl-strip .frp.cur{outline:2px solid var(--fg);outline-offset:1px}
.frl-t{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.frl-t .lbl{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.frl-t b{font-size:15px}
.frl-n{font:12px var(--f-mono);color:var(--muted)}
.frl-go{font-size:18px;color:var(--muted)}
@media (max-width:640px){.frl-strip .frp{width:20px}.frl-strip .frp:nth-child(n+5){display:none}}
.col.new input,.col.new textarea{width:100%}
.scrim{position:fixed;inset:0;background:rgba(10,8,7,.45);z-index:30}
.drawer{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(860px,calc(100% - 32px));max-height:calc(100dvh - 48px - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));z-index:31;
  background:var(--bg);border:1px solid var(--line);border-radius:12px;box-shadow:0 24px 80px rgba(0,0,0,.35);overflow-y:auto;padding:20px 24px 26px;display:flex;flex-direction:column;gap:18px;animation:pop .16s ease-out}
.drawer.narrow{width:min(520px,calc(100% - 32px))}
@keyframes pop{from{opacity:0;transform:translate(-50%,-48%) scale(.98)}to{opacity:1;transform:translate(-50%,-50%)}}
.drawer .top{display:flex;justify-content:flex-end;align-items:flex-start;position:sticky;top:0;z-index:3;height:0;overflow:visible}
.drawer .top .x{background:var(--bg)}
.mgrid{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:26px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:18px;min-width:0}
.mcol .info{display:flex;flex-direction:column;gap:6px;min-width:0;padding-right:72px}
.mcol .info h2{font-family:var(--f-display);font-stretch:80%;font-size:32px;line-height:1.02;margin:0;color:var(--fg);text-wrap:balance}
.mcol .info .d{color:var(--muted)}
.h2pre{display:block;font-size:.56em;font-weight:600;color:var(--muted);margin-bottom:4px;letter-spacing:.01em}
.x{width:38px;height:38px;display:grid;place-items:center;background:none;border:1px solid var(--line);border-radius:50%;padding:0;cursor:pointer;color:var(--muted)}
.x:hover{color:var(--fg);border-color:var(--muted)}
.dlink{background:none;border:0;padding:0;font:400 18px var(--f-body);color:var(--fg);cursor:pointer;text-align:left;align-self:flex-start;text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:4px}
.dlink:hover{text-decoration-color:var(--fg)}
.meta2{font:13px var(--f-mono);color:var(--muted);font-variant-numeric:tabular-nums}
.glinks{display:flex;flex-wrap:wrap;gap:4px 12px}
.glinks button{background:none;border:0;padding:0;font:italic 14px var(--f-body);color:var(--muted);cursor:pointer;text-decoration:underline;text-decoration-color:transparent;text-underline-offset:3px}
.glinks button:hover{color:var(--fg);text-decoration-color:var(--muted)}
.scores2{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.scl{display:inline-flex;align-items:center;gap:8px;color:var(--fg);text-decoration:none;font:500 15px var(--f-mono);font-variant-numeric:tabular-nums}
.scl .ico{height:22px;width:auto;display:block}
.scl:hover .ico{opacity:.75}
.scl .muted{color:var(--muted)}
.scbox{display:inline-flex;align-items:center;gap:8px}
.scbox input{width:64px;padding:5px 7px;font:14px var(--f-mono);text-align:center}
.colnav{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.colnav .mchip{cursor:pointer}
.colnav .mchip:hover{border-color:var(--muted);color:var(--fg)}
.editc{background:none;border:0;padding:0 4px;color:var(--muted);font-size:12.5px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.poster{aspect-ratio:2/3;max-width:180px;width:46%;background:var(--tile);color:var(--on-tile);border-radius:6px;padding:14px;display:flex;flex-direction:column;justify-content:space-between;align-self:flex-start}
.poster .pt{font-family:var(--f-display);font-stretch:75%;font-weight:800;font-size:22px;line-height:1.02;text-wrap:balance;overflow-wrap:anywhere}
.poster .py{font-family:var(--f-mono);font-size:12px;opacity:.7}
.head{display:flex;gap:16px;align-items:flex-start}
.head .info{min-width:0;display:flex;flex-direction:column;gap:6px}
.head .info h2{font-family:var(--f-display);font-stretch:80%;font-size:26px;line-height:1.05;margin:0;color:var(--fg)}
.head .info .d{color:var(--muted)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld>.lbl{font:500 10.5px var(--f-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--muted)}
.fld input,.fld textarea{width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.three{display:grid;grid-template-columns:2fr 1fr;gap:10px}
.starin{position:relative;display:inline-flex;font-size:30px;line-height:1;cursor:pointer;user-select:none;align-self:flex-start}
.starin .hit{position:absolute;top:0;bottom:0;width:.525em;background:none;border:0;padding:0;cursor:pointer}
.starin .hit:focus-visible{outline:2px solid var(--orange)}
.rv{font-family:var(--f-mono);font-size:13px;color:var(--muted);margin-left:10px;align-self:center}
.fld>.rv{align-self:flex-start;margin-left:0}
.mchips{display:flex;flex-wrap:wrap;gap:6px}
.mchip{font:500 12px/1 var(--f-body);padding:7px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--muted);cursor:pointer}
.mchip[aria-pressed=true]{background:var(--fg);border-color:var(--fg);color:var(--bg)}
.mchip[disabled]{cursor:default}
.watch{align-self:flex-start}
.ext{display:flex;gap:14px;font-size:13px}
.ext a{color:var(--fg);text-underline-offset:3px;text-decoration-color:var(--muted)}
.note{font-size:13.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:8px 10px}
.savebar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--tile);color:var(--on-tile);
  padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.savebar .in{max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.foot{margin-top:56px;display:flex;gap:10px;flex-wrap:wrap}
@media (max-width:640px){
  .yr{grid-template-columns:44px 1fr;gap:0 10px}.yr .y{font-size:15px}
  .film{grid-template-columns:minmax(0,1fr)}
  .rt{gap:10px}

    padding-bottom:calc(26px + env(safe-area-inset-bottom,0px));padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:max(18px,env(safe-area-inset-right,0px));animation:rise .2s ease-out}
  .drawer.narrow{width:100%}
  .mgrid{grid-template-columns:1fr;gap:18px}
  .mgrid .poster{max-width:190px;position:relative}
}
@keyframes rise{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){*{scroll-behavior:auto!important}.drawer{animation:none}}
.tile .art img,.poster img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:inherit}
.tile .art.has-img .ay,.tile .art.has-img .at,.tile .art.has-img .ad{visibility:hidden}
.poster{position:relative;overflow:hidden}

.mgrid .poster{width:100%;max-width:none;position:sticky;top:0}
.decades button.on .bar{background:var(--fg);opacity:1}
.decades button.on{color:var(--fg)}

.flat .yr{grid-template-columns:60px 1fr}

.tile .art .w{z-index:2}
.ov{font-size:14px;color:var(--muted);line-height:1.5}

<div id="app"></div>
<script id="main">
(function(){
const TITLE="Cinema";
/* If the site is not at <owner>.github.io/<repo>, set owner and repo here */
const CONFIG={owner:"",repo:"",branch:"main",path:"data/library.json"};
const IMG="https://image.tmdb.org/t/p/";
let films=[], cols=[];
const posterSrc=(f,w)=>f.poster.startsWith("http")?(w>400?f.poster.replace(/\._V1_.*\.jpg$/,"._V1_SX700.jpg"):f.poster):IMG+"w"+w+f.poster;
const ui={filters:false,fr:null,view:"films",director:null,layout:"grid",q:"",genre:null,col:null,show:"all",order:"new",decade:null,open:null,editable:false,dirty:false,saving:false,msg:"",adding:false};
const app=document.getElementById("app");
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const colName=id=>(cols.find(c=>c.id===id)||{}).name||"";
const $=s=>app.querySelector(s);
const uid=()=>"f"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);

function starsHTML(v,size){
  const five='<span class="s">★</span>'.repeat(5);
  return `<span class="stars" ${size?`style="font-size:${size}px"`:""} aria-label="${v} out of 5"><span class="base">${five}</span><span class="fill" style="width:${(v||0)*1.05}em">${five}</span></span>`;
}
function ratingsRow(f){
  let h="";
  if(f.lb!=null)h+=`<span><span class="k">LB</span>${Number(f.lb).toFixed(1)}</span>`;
  if(f.imdb!=null)h+=`<span><span class="k">IMDb</span>${Number(f.imdb).toFixed(1)}</span>`;
  return h?`<span class="rt">${h}</span>`:`<span class="rt"></span>`;
}

function shell(){
  app.innerHTML=`<div class="wrap">
    <header class="masthead">
      <a class="logo" id="home" href="./" aria-label="Cinema — home" title="Cinema"><span class="emo" aria-hidden="true">🤌</span></a>
      <nav class="nav" id="nav" role="tablist" aria-label="Sections"></nav>
      <div class="acts" id="acts"><button class="ib" id="fbtn" aria-label="Filters" aria-expanded="false" title="Filters"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg><span class="dot" hidden></span></button><button class="ib" id="addbtn" aria-label="Add" title="Add" hidden><svg viewBox="0 0 24 24" width="20" height="20" fill="none" aria-hidden="true"><path d="M12 5v14M5 12h14" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    </header>
    <div id="view"></div>
    <div class="foot" id="foot"></div>
    <p style="margin-top:20px;font-size:12px;color:var(--muted)">Posters and film data from <a href="https://www.omdbapi.com" target="_blank" rel="noopener" style="color:inherit">OMDb</a> and <a href="https://www.themoviedb.org" target="_blank" rel="noopener" style="color:inherit">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
  </div>
  <div id="drawerRoot"></div>
  <div class="savebar" id="savebar" hidden><div class="in"><span id="savemsg"></span><button class="btn" id="savebtn">Save to GitHub</button></div></div>`;
  $("#nav").onclick=e=>{const b=e.target.closest(".nt");if(!b)return;ui.view=b.dataset.v;ui.fr=null;ui.col=null;ui.q="";ui.genre=null;ui.show="all";ui.decade=null;ui.director=null;ui.order="new";render();window.scrollTo(0,0)};
  $("#savebtn").onclick=save;
  $("#home").onclick=e=>{e.preventDefault();closeDrawer();Object.assign(ui,{view:"films",fr:null,col:null,q:"",genre:null,show:"all",decade:null,director:null,order:"new",filters:false});render();window.scrollTo(0,0)};
  $("#fbtn").onclick=()=>{ui.filters=!ui.filters;const p=$("#fpanel");if(p)p.hidden=!ui.filters;acts()};
  $("#addbtn").onclick=()=>{ui.adding=true;ui.open=null;drawer()};
  document.addEventListener("keydown",e=>{if(e.key==="Escape"&&(ui.open||ui.adding||ui.access)){ui.access=false;closeDrawer()}});
}
const TYPE=f=>f.type||"film";
const VIEWS=[["films","Films",f=>TYPE(f)==="film"],["series","Series",f=>TYPE(f)==="series"],["shorts","Shorts",f=>TYPE(f)==="short"],["watched","Watched",f=>f.w]];
/* "Mission: Impossible – Fallout" → ["Mission: Impossible","Fallout"], only when the title starts with its franchise name */
const splitFr=f=>{if(!f.fr)return [f.t,""];const base=f.fr.replace(/\s*\(.*\)$/,"");if(!f.t.startsWith(base))return [f.t,""];
  const m=f.t.slice(base.length).match(/^(?::\s+|\s+[–—-]\s+)(.+)$/);return m?[base,m[1]]:[f.t,""]};
const shortT=f=>{const [a,b]=splitFr(f);return b||a};
const frNames=()=>[...new Set(films.filter(f=>f.fr).map(f=>f.fr))];
const NOUN={films:"film",series:"series",shorts:"short",watched:"film",collections:"film",franchises:"film"};
const VTYPE={series:"series",shorts:"short"};
function viewPred(){if(ui.view==="franchises")return f=>!!f.fr&&(!ui.fr||f.fr===ui.fr);const v=VIEWS.find(x=>x[0]===ui.view);return v?v[2]:()=>true}
function stats(){
  $("#nav").innerHTML=VIEWS.map(([id,label,pr])=>`<button class="nt" role="tab" data-v="${id}" aria-selected="${ui.view===id}"><b>${films.filter(pr).length}</b>${label}</button>`).join("")+
    `<button class="nt" role="tab" data-v="franchises" aria-selected="${ui.view==="franchises"}"><b>${frNames().length}</b>Franchises</button>`+
    `<button class="nt" role="tab" data-v="collections" aria-selected="${ui.view==="collections"}"><b>${cols.length}</b>Collections</button>`;
}
function filtersActive(){return !!(ui.q||ui.genre||ui.decade!=null||ui.show!=="all"||(ui.col&&ui.view!=="collections")||(ui.order!=="new"&&!(ui.col&&ui.order==="imdb"))||ui.layout!=="grid")}
function acts(){
  const grid=(ui.view==="collections"&&!ui.col)||(ui.view==="franchises"&&!ui.fr);
  $("#fbtn").hidden=grid;$("#fbtn").setAttribute("aria-expanded",ui.filters&&!grid);
  $("#fbtn .dot").hidden=!filtersActive();
  $("#addbtn").hidden=!ui.editable||grid;$("#addbtn").setAttribute("aria-label","Add "+NOUN[ui.view]);$("#addbtn").title="Add "+NOUN[ui.view];
}
function render(){
  stats();
  if(ui.view==="collections"&&!ui.col)collectionsView();else if(ui.view==="franchises"&&!ui.fr)franchisesView();else libraryView();
  foot();bar();acts();
}
function libraryView(){
  const c=ui.col?cols.find(x=>x.id===ui.col):null;
  const dn=ui.director?films.filter(f=>f.d===ui.director).length:0;
  $("#view").innerHTML=(ui.director?`<div class="banner"><div><h2>${esc(ui.director)}</h2><p>${dn} ${dn===1?"title":"titles"} in the library</p></div><button id="cleardir">Clear filter</button></div>`:"")+
  (ui.fr?`<div class="banner"><div><h2>${esc(ui.fr)}</h2><p>${films.filter(f=>f.fr===ui.fr).length} titles · in watch order</p></div><button id="clearfr">All franchises</button></div>`:"")+
  (c?`<div class="banner"><div><h2>${esc(c.name)}</h2><p>${esc(c.desc)}</p></div><button id="clearcol">${ui.view==="collections"?"All collections":"Clear filter"}</button></div>`:"")+
  `<div class="fpanel" id="fpanel" ${ui.filters?"":"hidden"}>${c||ui.director?"":`<div class="decades" id="decades" aria-label="Films by decade"></div>`}<div class="tools">
    <input type="search" id="q" placeholder="Search title, director, genre" aria-label="Search" value="${esc(ui.q)}">
    <select id="gensel" aria-label="Genre"><option value="">All genres</option>${[...new Set(films.flatMap(f=>f.g||[]))].sort().map(g=>`<option ${ui.genre===g?"selected":""}>${esc(g)}</option>`).join("")}</select>
    <select id="colsel" aria-label="Collection"><option value="">All collections</option>${cols.map(x=>`<option value="${x.id}" ${ui.col===x.id?"selected":""}>${esc(x.name)}</option>`).join("")}</select>
    ${ui.view==="watched"?"":`<select id="show" aria-label="Status">${[["all","Everything"],["todo","To watch"],["seen","Watched"]].map(([v,l])=>`<option value="${v}" ${ui.show===v?"selected":""}>${l}</option>`).join("")}</select>`}
    <select id="order" aria-label="Sort">${[["new","Newest first"],["old","Oldest first"],["title","Title A–Z"],["imdb","IMDb rating"]].map(([v,l])=>`<option value="${v}" ${ui.order===v?"selected":""}>${l}</option>`).join("")}</select>
    <span class="seg" id="seg"><button data-l="grid" aria-pressed="${ui.layout==="grid"}">Grid</button><button data-l="list" aria-pressed="${ui.layout==="list"}">List</button></span>
  </div></div><div id="list"></div>`;
  if($("#decades"))decades();
  if($("#cleardir"))$("#cleardir").onclick=()=>{ui.director=null;render()};
  if($("#clearfr"))$("#clearfr").onclick=()=>{ui.fr=null;render()};
  $("#q").oninput=e=>{ui.q=e.target.value.trim().toLowerCase();list()};
  $("#colsel").onchange=e=>{ui.col=e.target.value||null;libraryView()};
  $("#gensel").onchange=e=>{ui.genre=e.target.value||null;list()};
  $("#seg").onclick=e=>{const b=e.target.closest("button");if(!b)return;ui.layout=b.dataset.l;$("#seg").querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b));list()};
  if($("#show"))$("#show").onchange=e=>{ui.show=e.target.value;list()};
  $("#order").onchange=e=>{ui.order=e.target.value;list()};
  if($("#clearcol"))$("#clearcol").onclick=()=>{ui.col=null;render()};
  list();
}
function decades(){
  const P=viewPred(),src=films.filter(P);
  if(!src.length){const el=$("#decades");if(el)el.innerHTML="";return}
  const m={};src.forEach(f=>{const d=Math.floor(f.y/10)*10;m[d]=(m[d]||0)+1});
  const ys=src.map(f=>f.y),lo=Math.floor(Math.min(...ys)/10)*10,hi=Math.floor(Math.max(...ys)/10)*10,max=Math.max(...Object.values(m));
  let h="";for(let d=lo;d<=hi;d+=10)h+=`<button data-d="${d}" title="${d}s: ${m[d]||0} — click to filter"><span class="bar" style="height:${(m[d]||0)/max*42+1}px"></span>${String(d).slice(2)}</button>`;
  const el=$("#decades");el.innerHTML=h;
  el.classList.toggle("filtering",ui.decade!=null);
  el.querySelectorAll("button").forEach(b=>{b.classList.toggle("on",Number(b.dataset.d)===ui.decade);b.setAttribute("aria-pressed",Number(b.dataset.d)===ui.decade)});
  el.onclick=e=>{const b=e.target.closest("button");if(!b)return;const d=Number(b.dataset.d);ui.decade=ui.decade===d?null:d;decades();list()};
}
const SORT={
  new:(a,b)=>b.y-a.y||a.t.localeCompare(b.t),
  old:(a,b)=>a.y-b.y||a.t.localeCompare(b.t),
  saga:(a,b)=>(a.frI??99)-(b.frI??99)||a.y-b.y,
  title:(a,b)=>a.t.replace(/^(the|a|an) /i,"").localeCompare(b.t.replace(/^(the|a|an) /i,"")),
  imdb:(a,b)=>(b.imdb??-1)-(a.imdb??-1)||b.y-a.y};
function tileHTML(f){
  return `<button class="tile film-t" data-id="${esc(f.id)}">
    <span class="art${f.poster?" has-img":""}">${f.poster?`<img src="${posterSrc(f,342)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:""}<span class="ay">${f.y}</span><span class="at">${esc(f.t)}</span><span class="ad">${esc(f.d)}</span>${f.w?`<span class="w">Watched</span>`:""}</span>
    <span class="cap"><span class="ct" title="${esc(f.t)}">${esc(shortT(f))}</span><span class="cy">${f.y}${f.imdb!=null?" · "+Number(f.imdb).toFixed(1):""}</span></span></button>`;
}
function rowHTML(f,withYear){
  return `<button class="film" data-id="${esc(f.id)}">
    <span><span class="t">${esc(f.t)}</span>${f.w?`<span class="seen">Watched</span>`:""}
    <span class="meta" style="display:block">${withYear?f.y+" · ":""}${esc(f.d)}${(f.g||[]).length?` · <span class="gen">${esc(f.g.join(", "))}</span>`:""}</span></span>
    ${ratingsRow(f)}
  </button>`;
}
function list(){
  const P=viewPred();
  const L=films.filter(f=>P(f)&&(!ui.col||f.c.includes(ui.col))&&(ui.decade==null||Math.floor(f.y/10)*10===ui.decade)&&(!ui.director||f.d===ui.director)&&(!ui.q||(f.t+" "+f.d+" "+(f.g||[]).join(" ")).toLowerCase().includes(ui.q))&&(!ui.genre||(f.g||[]).includes(ui.genre))&&
    (ui.show==="all"||(ui.show==="seen"&&f.w)||(ui.show==="todo"&&!f.w)))
    .sort(ui.fr&&ui.order==="new"?SORT.saga:(SORT[ui.order]||SORT.new));
  const el=$("#list");if(!el)return;acts();
  if(!L.length){const any=films.some(P);el.innerHTML=`<p class="empty">${!films.length?"Loading the library…":any?"Nothing matches. Clear the search or filters.":ui.view==="watched"?"Nothing watched yet.":`No ${ui.view} yet.${ui.editable?` Add one with “Add ${NOUN[ui.view]}”.`:""}`}</p>`;return}
  let h="";
  if(ui.layout==="grid")h=`<div class="grid" style="margin-top:22px">${L.map(tileHTML).join("")}</div>`;
  else if(ui.order==="new"||ui.order==="old"){
    const Y=new Map();L.forEach(f=>{if(!Y.has(f.y))Y.set(f.y,[]);Y.get(f.y).push(f)});
    h=`<div class="flat" style="margin-top:16px">`;Y.forEach((arr,y)=>{h+=`<div class="yr"><div class="y">${y}</div><div class="films">${arr.map(f=>rowHTML(f,false)).join("")}</div></div>`});h+=`</div>`;
  }else h=`<div class="films" style="margin-top:16px">${L.map(f=>rowHTML(f,true)).join("")}</div>`;
  el.innerHTML=h;
  el.onclick=e=>{const b=e.target.closest(".film,.film-t");if(!b)return;ui.open=b.dataset.id;ui.adding=false;drawer()};
}
function collectionsView(){
  let h=`<div class="cols">`+cols.map(c=>{
    const fs=films.filter(f=>f.c.includes(c.id)),w=fs.filter(f=>f.w).length;
    const peek=fs.slice().sort((a,b)=>(b.imdb??-1)-(a.imdb??-1)).slice(0,6).map(f=>f.t).join(" · ");
    return `<button class="col" data-c="${c.id}"><span class="cnt">${fs.length} films${w?` · ${w} watched`:""}</span><h3>${esc(c.name)}</h3><p>${esc(c.desc)}</p><span class="peek">${esc(peek)}</span></button>`}).join("");
  if(ui.editable)h+=`<form class="col new" id="newcol"><h3>New collection</h3>
    <input type="text" id="nc-name" placeholder="Name, e.g. Rainy Sunday" required aria-label="Collection name">
    <textarea id="nc-desc" rows="2" placeholder="What mood is it for?" aria-label="Description"></textarea>
    <button class="btn" type="submit">Create</button></form>`;
  $("#view").innerHTML=h+`</div>`;
  $("#view").querySelector(".cols").onclick=e=>{const b=e.target.closest("button.col");if(!b)return;ui.col=b.dataset.c;ui.q="";ui.order="imdb";render();window.scrollTo(0,0)};
  if($("#newcol"))$("#newcol").onsubmit=e=>{e.preventDefault();const n=$("#nc-name").value.trim();if(!n)return;
    cols.push({id:"c"+Date.now().toString(36),name:n,desc:$("#nc-desc").value.trim()});dirty();render()};
}
function franchisesView(){
  const names=frNames().sort((a,b)=>{const ya=Math.min(...films.filter(f=>f.fr===a).map(f=>f.y)),yb=Math.min(...films.filter(f=>f.fr===b).map(f=>f.y));return yb-ya});
  $("#view").innerHTML=`<div class="frs">`+names.map(n=>{
    const fs=films.filter(f=>f.fr===n).sort((a,b)=>(a.frI??0)-(b.frI??0)),ys=fs.map(f=>f.y),w=fs.filter(f=>f.w).length;
    return `<button class="fr" data-fr="${esc(n)}"><span class="frstrip">${fs.slice(0,5).map(f=>`<span class="frp${f.poster?" has-img":""}">${f.poster?`<img src="${posterSrc(f,342)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:""}</span>`).join("")}</span>
      <span class="frt"><b>${esc(n)}</b><span>${fs.length} titles · ${Math.min(...ys)}–${Math.max(...ys)}${w?` · ${w} watched`:""}</span></span></button>`}).join("")+`</div>`;
  $("#view").querySelector(".frs").onclick=e=>{const b=e.target.closest("button.fr");if(!b)return;ui.fr=b.dataset.fr;ui.q="";ui.order="new";render();window.scrollTo(0,0)};
}
function foot(){
  $("#foot").innerHTML=`<button class="btn ghost" id="access">${ui.editable?"Editor access ✓":"Editor access"}</button>${ui.editable?`<button class="btn ghost" id="export">Export data (JSON)</button>`:""}`;
  $("#access").onclick=accessDrawer;
  if($("#export"))$("#export").onclick=exportData;
}

/* drawer */

  document.body.classList.add("lock");

  const imUrl=f?(f.imdbId?"https://www.imdb.com/title/"+f.imdbId+"/":"https://www.imdb.com/find/?s=tt&q="+encodeURIComponent(f.t+" "+f.y)):"";

      <label class="fld"><span class="lbl">Type</span><select id="a-type">${[["film","Film"],["series","Series"],["short","Short"]].map(([v,l])=>`<option value="${v}" ${(VTYPE[ui.view]||"film")===v?"selected":""}>${l}</option>`).join("")}</select></label>

      <label class="fld"><span class="lbl">Note</span><textarea id="a-n" rows="2"></textarea></label>

  }else{
    const E=ui.editable;
    h+=`<div class="mgrid"><div class="poster${f.poster?" has-img":""}">${f.poster?`<img src="${posterSrc(f,500)}" alt="Poster: ${esc(f.t)}" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:""}<span class="py">${f.y}</span><span class="pt">${esc(f.t)}</span><span class="py">${esc(f.d)}</span></div>
      <div class="mcol"><div class="info">${(()=>{const [a,b]=splitFr(f);return `<h2>${b?`<span class="h2pre">${esc(a)}</span>${esc(b)}`:esc(a)}</h2>`})()}
        ${f.d?`<button class="dlink" id="dirlink" title="All films by ${esc(f.d)}">${esc(f.d)}</button>`:""}
        <span class="meta2">${f.y}${f.runtime?` · ${f.runtime} min`:""}</span>
        ${(f.g||[]).length?`<div class="glinks" id="glinks">${f.g.map(g=>`<button data-g="${esc(g)}" title="All ${esc(g)} films">${esc(g)}</button>`).join("")}</div>`:""}
      ${E?`<button class="btn ${f.w?"":"ghost"} watch" id="watch">${f.w?"Watched ✓":"Mark as watched"}</button>`:(f.w?`<span class="seen" style="margin:0;align-self:flex-start;font:500 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--brown);border:1px solid currentColor;border-radius:3px;padding:3px 6px">Watched</span>`:"")}
      </div>
      <div class="scores2">

      ${f.overview?`<p class="ov" style="margin:0">${esc(f.overview)}</p>`:""}
      ${f.fr?(()=>{const fs=films.filter(x=>x.fr===f.fr).sort((a,b)=>(a.frI??0)-(b.frI??0));const i=fs.findIndex(x=>x.id===f.id);
        return `<button type="button" class="frlink" id="frlink" title="Open franchise"><span class="frl-strip">${fs.slice(0,6).map(x=>`<span class="frp${x.poster?" has-img":""}${x.id===f.id?" cur":""}">${x.poster?`<img src="${posterSrc(x,342)}" alt="" loading="lazy" onerror="this.parentNode.classList.remove('has-img');this.remove()">`:""}</span>`).join("")}</span>
          <span class="frl-t"><span class="lbl">Franchise</span><b>${esc(f.fr)}</b><span class="frl-n">Part ${i+1} of ${fs.length}</span></span><span class="frl-go" aria-hidden="true">→</span></button>`})():""}
      <div class="fld"><span class="lbl">Collections</span>
        <div class="colnav" id="colnav">${cols.filter(c=>f.c.includes(c.id)).map(c=>`<button type="button" class="mchip" data-go="${c.id}" title="Open collection">${esc(c.name)}</button>`).join("")||`<span class="rv" style="margin:0">None</span>`}${E?`<button type="button" class="editc" id="editc">Edit</button>`:""}</div>
        ${E?`<div class="mchips" id="fc" hidden>${cols.map(c=>`<button type="button" class="mchip" data-c="${c.id}" aria-pressed="${f.c.includes(c.id)}">${esc(c.name)}</button>`).join("")}</div>`:""}
      </div>
      ${E?`<label class="fld"><span class="lbl">Note</span><textarea id="note" rows="2">${esc(f.n)}</textarea></label>
        <details><summary style="cursor:pointer;color:var(--muted);font-size:13px">Edit details</summary>
          <div style="display:flex;flex-direction:column;gap:10px;margin-top:10px">
          <label class="fld"><span class="lbl">Title</span><input type="text" id="e-t" value="${esc(f.t)}"></label>
          <div class="three"><label class="fld"><span class="lbl">Director</span><input type="text" id="e-d" value="${esc(f.d)}"></label><label class="fld"><span class="lbl">Year</span><input type="number" id="e-y" value="${f.y}"></label></div>
          <label class="fld"><span class="lbl">Genres (comma-separated)</span><input type="text" id="e-g" value="${esc((f.g||[]).join(", "))}"></label>
          <label class="fld"><span class="lbl">IMDb link or ID</span><input type="text" id="e-imdb" placeholder="https://www.imdb.com/title/tt0064116/" value="${esc(f.imdbId||"")}"></label>
          <label class="fld"><span class="lbl">Poster image URL (optional)</span><input type="text" id="e-poster" placeholder="Right-click a poster → Copy Image Address" value="${esc(f.posterLock?f.poster:"")}"></label>
          <span class="rv" style="margin:0;font-size:12px">After Save to GitHub, the poster and IMDb data refresh in a few minutes.</span>
          <label class="fld"><span class="lbl">Type</span><select id="e-type">${[["film","Film"],["series","Series"],["short","Short"]].map(([v,l])=>`<option value="${v}" ${TYPE(f)===v?"selected":""}>${l}</option>`).join("")}</select></label></div></details>`
        :(f.n?`<div class="note">${esc(f.n)}</div>`:"")}</div></div>`;
  }
  root.innerHTML=h+`</aside>`;
  const R=s=>root.querySelector(s);
  R("#close").onclick=closeDrawer;R("#scrim").onclick=closeDrawer;R("#close").focus();
  if(ui.adding){
    R("#a-c").onclick=e=>{const b=e.target.closest(".mchip");if(b)b.setAttribute("aria-pressed",b.getAttribute("aria-pressed")!=="true")};
    R("#addf").onsubmit=e=>{e.preventDefault();const t=R("#a-t").value.trim(),y=parseInt(R("#a-y").value,10);if(!t||!y)return;
      const c=[...R("#a-c").querySelectorAll('[aria-pressed="true"]')].map(b=>b.dataset.c);
      const g=R("#a-g").value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3);
      const nf={id:uid(),type:R("#a-type").value,t,y,d:R("#a-d").value.trim(),g,n:R("#a-n").value.trim(),w:false,r:null,lb:null,imdb:null,c};
      films.push(nf);dirty();ui.adding=false;ui.open=nf.id;rerender();drawer()};
    return;
  }
  const go=fn=>{closeDrawer();ui.view=TYPE(f)==="series"?"series":TYPE(f)==="short"?"shorts":"films";ui.col=null;ui.q="";ui.decade=null;ui.director=null;ui.genre=null;ui.show="all";fn();render();window.scrollTo(0,0)};
  if(R("#dirlink"))R("#dirlink").onclick=()=>go(()=>{ui.director=f.d});
  if(R("#glinks"))R("#glinks").onclick=e=>{const b=e.target.closest("[data-g]");if(b)go(()=>{ui.genre=b.dataset.g})};
  if(R("#frlink"))R("#frlink").onclick=()=>{const n=f.fr;closeDrawer();Object.assign(ui,{view:"franchises",fr:n,col:null,q:"",order:"new",decade:null,director:null,genre:null,show:"all"});render();window.scrollTo(0,0)};
  R("#colnav").onclick=e=>{const b=e.target.closest("[data-go]");if(!b)return;const id=b.dataset.go;closeDrawer();ui.view="collections";ui.col=id;ui.q="";ui.order="imdb";ui.decade=null;ui.director=null;ui.genre=null;render();window.scrollTo(0,0)};
  if(!ui.editable)return;
  R("#editc").onclick=()=>{const fc=R("#fc");fc.hidden=!fc.hidden;R("#editc").textContent=fc.hidden?"Edit":"Done"};
  R("#watch").onclick=()=>{f.w=!f.w;dirty();rerender();drawer()};
  const num=(id,k,max)=>R(id).onchange=e=>{const v=e.target.value===""?null:Number(e.target.value);f[k]=v==null||isNaN(v)?null:Math.min(max,Math.max(0,v));dirty();rerender()};
  R("#fc").onclick=e=>{const b=e.target.closest(".mchip");if(!b)return;const c=b.dataset.c;f.c=f.c.includes(c)?f.c.filter(x=>x!==c):[...f.c,c];b.setAttribute("aria-pressed",f.c.includes(c));
    R("#colnav").querySelectorAll("[data-go]").forEach(x=>x.remove());const before=R("#colnav").firstChild;R("#colnav").insertAdjacentHTML("afterbegin",cols.filter(x=>f.c.includes(x.id)).map(x=>`<button type="button" class="mchip" data-go="${x.id}" title="Open collection">${esc(x.name)}</button>`).join(""));
    const none=R("#colnav").querySelector(".rv");if(none&&f.c.length)none.remove();dirty();rerender()};
  R("#note").onchange=e=>{f.n=e.target.value.trim();dirty()};
  R("#e-t").onchange=e=>{const v=e.target.value.trim();if(v){f.t=v;dirty();rerender()}};
  R("#e-d").onchange=e=>{f.d=e.target.value.trim();dirty();rerender()};
  R("#e-imdb").onchange=e=>{const m=e.target.value.match(/tt\d{6,}/);if(!m){e.target.setCustomValidity("Paste an IMDb link or an ID like tt0064116");e.target.reportValidity();return}
    e.target.setCustomValidity("");f.imdbId=m[0];f.idLock=true;f.v=0;f.imdb=null;f.lb=null;f.lbUrl=null;f.runtime=null;f.overview=null;if(!f.posterLock)f.poster="";dirty();rerender()};
  R("#e-poster").onchange=e=>{const v=e.target.value.trim();if(v&&!/^https:\/\//.test(v)){e.target.setCustomValidity("Use a full https:// image address");e.target.reportValidity();return}
    e.target.setCustomValidity("");if(v){f.poster=v;f.posterLock=true}else{f.poster="";f.posterLock=false;f.v=0}dirty();rerender();drawer()};
  R("#e-type").onchange=e=>{f.type=e.target.value;dirty();rerender()};
  R("#e-g").onchange=e=>{f.g=e.target.value.split(",").map(x=>x.trim()).filter(Boolean).slice(0,3);dirty();rerender()};
  R("#e-y").onchange=e=>{const v=parseInt(e.target.value,10);if(v){f.y=v;dirty();rerender()}};
}
function rerender(){stats();if(ui.view==="collections"&&!ui.col)collectionsView();else if(ui.view==="franchises"&&!ui.fr)franchisesView();else list();bar()}

/* saving */
function dirty(){ui.dirty=true;ui.msg="";bar()}
function bar(){
  const b=$("#savebar");b.hidden=!(ui.dirty||ui.msg);
  $("#savemsg").textContent=ui.msg||"Unsaved changes";
  const s=$("#savebtn");s.hidden=!ui.dirty;s.disabled=ui.saving;s.textContent=ui.saving?"Saving…":"Save to GitHub";
}
/* ---------- GitHub storage ---------- */
function repoInfo(){
  const h=location.hostname,parts=location.pathname.split("/").filter(Boolean);
  const owner=CONFIG.owner||(h.endsWith(".github.io")?h.split(".")[0]:"");
  const repo=CONFIG.repo||(h.endsWith(".github.io")?(parts[0]||h):"");
  return {owner,repo};
}
const TOKEN_KEY="film-library-token";
function getToken(){try{return localStorage.getItem(TOKEN_KEY)||""}catch(e){return ""}}
function setToken(t){try{t?localStorage.setItem(TOKEN_KEY,t):localStorage.removeItem(TOKEN_KEY)}catch(e){}}
async function gh(path,opts={}){
  const {owner,repo}=repoInfo();
  const r=await fetch(`https://api.github.com/repos/${owner}/${repo}${path}`,{...opts,headers:{"Accept":"application/vnd.github+json","Authorization":"Bearer "+getToken(),...(opts.headers||{})}});
  if(!r.ok){const e=new Error("GitHub "+r.status);e.status=r.status;throw e}
  return r.json();
}
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,"")),c=>c.charCodeAt(0)));
const b64enc=s=>{const b=new TextEncoder().encode(s);let x="";for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
async function readRemote(){
  const j=await gh(`/contents/${CONFIG.path}?ref=${CONFIG.branch}&t=${Date.now()}`);
  return {sha:j.sha,data:JSON.parse(b64dec(j.content))};
}
/* Merge on save: the repo copy is the base (it may hold fresh posters from the enrich script);
   only fields changed in this browser since load are laid on top. */
const PERSONAL=["t","y","d","g","n","w","r","c","type"];
const MANUAL=["imdbId","idLock","poster","posterLock","v","imdb","runtime","overview","lb","lbUrl"];
let base=new Map();
const snap=list=>new Map(list.map(f=>[f.id,JSON.parse(JSON.stringify(f))]));
const same=(a,b)=>JSON.stringify(a??null)===JSON.stringify(b??null);
function merge(remote){
  const R=new Map(remote.films.map(f=>[f.id,f]));
  const out=remote.films.map(r=>{
    const f=films.find(x=>x.id===r.id),b=base.get(r.id);if(!f||!b)return r;
    const m={...r};PERSONAL.forEach(k=>{if(!same(f[k],b[k]))m[k]=f[k]});
    if(["imdbId","idLock","poster","posterLock"].some(k=>!same(f[k],b[k])))MANUAL.forEach(k=>{m[k]=f[k]});
    return m});
  films.forEach(f=>{if(!R.has(f.id)&&!base.has(f.id))out.push(f)});
  const C=new Map(remote.cols.map(c=>[c.id,c]));cols.forEach(c=>C.set(c.id,c));
  return {films:out,cols:[...C.values()]};
}
const deleted=new Set();
async function save(){
  if(ui.saving)return;ui.saving=true;ui.msg="";bar();
  try{
    for(let attempt=0;attempt<2;attempt++){
      const {sha,data}=await readRemote();
      const merged=merge(data);
      try{
        await gh(`/contents/${CONFIG.path}`,{method:"PUT",body:JSON.stringify({message:"Update library from web app",content:b64enc(JSON.stringify(merged,null,1)+"\n"),sha,branch:CONFIG.branch})});
        films=merged.films;cols=merged.cols;base=snap(films);ui.dirty=false;ui.msg="Saved";break;
      }catch(e){if(e.status===409&&attempt===0)continue;throw e}
    }
  }catch(e){
    ui.msg=e.status===401||e.status===403?"GitHub refused the token. Check it in Editor access":e.status===404?"Repository or file not found. Check Editor access settings":"Couldn't save. Check your connection and try again";
  }
  ui.saving=false;render();
}
function exportData(){
  const blob=new Blob([JSON.stringify({films,cols},null,1)],{type:"application/json"});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="film-library.json";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);
}
function accessDrawer(){
  const root=document.getElementById("drawerRoot");document.body.classList.add("lock");ui.access=true;
  const {owner,repo}=repoInfo();const has=!!getToken();
  root.innerHTML=`<div class="scrim" id="scrim"></div><aside class="drawer narrow" role="dialog" aria-modal="true" aria-label="Editor access"><div class="top"><button class="x" id="close" aria-label="Close"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button></div>
    <div class="head"><div class="info"><h2>Editor access</h2><span class="d">Paste a GitHub token that can write to <b>${esc(owner)}/${esc(repo)}</b>. It stays in this browser only. Visitors without a token see the library read-only.</span></div></div>
    <label class="fld"><span class="lbl">GitHub token</span><input type="password" id="tok" autocomplete="off" placeholder="github_pat_…" value="${has?"••••••••":""}"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn" id="tsave">Save token</button>${has?`<button class="btn ghost" id="tclear">Sign out</button>`:""}</div>
    <span class="rv" id="tmsg" style="margin:0"></span></aside>`;
  const R=s=>root.querySelector(s),close=()=>{ui.access=false;closeDrawer()};
  R("#close").onclick=close;R("#scrim").onclick=close;
  R("#tsave").onclick=async()=>{const v=R("#tok").value.trim();if(!v||v.startsWith("•"))return;setToken(v);R("#tmsg").textContent="Checking…";
    try{const j=await gh("");if(!j.permissions||!j.permissions.push)throw Object.assign(new Error(),{status:403});ui.editable=true;R("#tmsg").textContent="Connected. You can edit now.";render()}
    catch(e){setToken("");ui.editable=false;R("#tmsg").textContent=e.status===404?"Repository not found for this token.":"This token can't write to the repository.";render()}};
  if(R("#tclear"))R("#tclear").onclick=()=>{setToken("");ui.editable=false;close();render()};
}
async function load(){
  try{
    if(getToken()){try{const {data}=await readRemote();films=data.films;cols=data.cols;ui.editable=true}catch(e){ui.editable=false}}
    if(!films.length){
      const {owner,repo}=repoInfo();let d=null;
      if(owner&&repo){try{const r=await fetch(`https://raw.githubusercontent.com/${owner}/${repo}/${CONFIG.branch}/${CONFIG.path}?v=${Date.now()}`);if(r.ok)d=await r.json()}catch(e){}}
      if(!d){const r=await fetch(CONFIG.path+"?v="+Date.now());d=await r.json()}
      films=d.films;cols=d.cols}
    base=snap(films);
  }catch(e){ui.msg="Couldn't load the library";}
  render();
}
window.addEventListener("beforeunload",e=>{if(ui.dirty){e.preventDefault();e.returnValue=""}});
shell();render();load();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
})();
</script>
</body>
